[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-folio"
version = "0.1.0"
description = "A FastAPI-based chat interface using Mistral AI and HTMX for recruiters and potential clients."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "jinja2",
    "mistralai>=1.10.0",
    "pypdf",
    "python-multipart",
    "httpx",
    "pydantic-settings",
    "sse-starlette>=3.3.0",
    "sqlmodel>=0.0.34",
    "aiosqlite>=0.22.1",
    "greenlet>=3.2.5",
    "alembic>=1.16.5",
    "linkify-it-py>=2.0.3",
    "limits>=5.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "basedpyright",
    "playwright>=1.60.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff.lint.per-file-ignores]
# The UI/SSE tests start a real uvicorn server as a subprocess on purpose.
"tests/*" = ["ASYNC220"]

[tool.basedpyright]
typeCheckingMode = "recommended"
# CI fails on errors only; the existing warnings are cleaned up over time.
failOnWarnings = false
# Generated migrations are not type-checked
ignore = [
    "alembic/versions",
]

[tool.pytest.ini_options]
addopts = "-n auto"
asyncio_default_fixture_loop_scope = "function"
