name: SBOM & Vulnerability Watch

# Records a CycloneDX SBOM for every image this repo ships and checks it against
# the latest Trivy database. A push to main builds the images and stores their SBOM;
# the scheduled run only rescans that stored SBOM, which takes seconds. It runs every
# 6 hours, just after Trivy rebuilds its database (00/06/12/18 UTC): Trivy has no push
# feed, so this is the earliest it can see an advisory published after the build.
#
# A new set of fixable HIGH/CRITICAL findings is posted to the T3 Code webhook in
# the T3_VULN_WEBHOOK_URL secret, which opens a thread that patches them. The same
# set is posted once (remembered through the Actions cache, which forgets entries
# unused for 7 days, so an unresolved set is re-sent about weekly). Findings
# accepted in .trivyignore are left out. This workflow never blocks a deploy; the
# blocking scan stays in CI.
#
# Each push also submits the image's packages to GitHub's dependency graph, so a
# new GitHub advisory for a package inside the image raises a Dependabot alert
# within minutes, without waiting for the next rescan. (Dependabot covers language
# packages such as PyPI and npm, not Alpine/Debian OS packages.)
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-vuln-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: SBOM & scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # dependency-graph snapshot submission
    strategy:
      fail-fast: false
      matrix:
        # context: build this directory; image: scan this public image instead.
        include:
          - name: app
            context: "."
            image: ""
            cache-scope: ""
    env:
      # A built image is tagged <name>:sbom; a pulled one is scanned as given.
      IMAGE_REF: ${{ matrix.image || format('{0}:sbom', matrix.name) }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      SBOM_FILE: sbom-${{ matrix.name }}.cdx.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scheduled runs reuse the SBOM the push run stored for this commit. Pulled
      # images (no build context) are always re-read, since their tag moves.
      - name: Restore the SBOM of this commit
        id: stored
        if: matrix.context && github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SBOM_FILE }}
          key: sbom-${{ matrix.name }}-${{ github.sha }}

      - name: Set up Docker Buildx
        if: matrix.context && steps.stored.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reuses the layers CI cached for main, so the SBOM matches what CI built
      # and shipped rather than a fresh rebuild.
      - name: Build image
        if: matrix.context && steps.stored.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          cache-from: ${{ matrix.cache-scope && format('type=gha,scope={0}', matrix.cache-scope) || 'type=gha' }}

      - name: Pull image
        if: matrix.image
        run: docker pull --platform linux/amd64 "$IMAGE_REF"

      - name: Generate CycloneDX SBOM
        if: steps.stored.outputs.cache-hit != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: ${{ env.SBOM_FILE }}
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}

      - name: Store the SBOM for scheduled rescans
        if: matrix.context && steps.stored.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SBOM_FILE }}
          key: sbom-${{ matrix.name }}-${{ github.sha }}

      # One snapshot per image: the correlator keeps the matrix legs from replacing
      # each other's snapshot. Scheduled runs change nothing here, so they skip it.
      - name: Submit image packages to the GitHub dependency graph
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
        run: |
          trivy sbom "$SBOM_FILE" --quiet --skip-version-check --format github --output snapshot.json
          jq --arg corr "sbom-vuln-watch_$NAME" --arg id "$GITHUB_RUN_ID" \
             --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
             '.version = 0 | .job = {correlator: $corr, id: $id} | .sha = $sha | .ref = $ref
              | .scanned = (now | todate)' snapshot.json > snapshot.submit.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input snapshot.submit.json --jq '"dependency snapshot \(.id): \(.result)"'

      # Without the action's day-keyed DB cache, every rescan downloads the newest
      # database instead of one restored from earlier the same day.
      - name: Scan the SBOM for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "false"
          scan-type: sbom
          scan-ref: ${{ env.SBOM_FILE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ${{ hashFiles('.trivyignore') != '' && '.trivyignore' || '' }}
          format: json
          output: trivy-${{ matrix.name }}.json
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}

      - name: Extract findings
        run: |
          jq --arg image "$IMAGE_REF" '[.Results[]? | .Target as $t | .Vulnerabilities[]? | {
              image: $image, target: $t, id: .VulnerabilityID, severity: .Severity,
              package: .PkgName, installed: .InstalledVersion, fixed: .FixedVersion,
              title: ((.Title // "") | .[0:160]), url: (.PrimaryURL // "")}]' \
            "trivy-${{ matrix.name }}.json" > "findings-${{ matrix.name }}.json"
          echo "$(jq length "findings-${{ matrix.name }}.json") fixable HIGH/CRITICAL finding(s) in $IMAGE_REF"

      - name: Upload SBOM and scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: |
            ${{ env.SBOM_FILE }}
            trivy-${{ matrix.name }}.json
          retention-days: 90

      - name: Upload findings for the notify job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-${{ matrix.name }}
          path: findings-${{ matrix.name }}.json
          retention-days: 7

  notify:
    name: Notify T3 Code
    runs-on: ubuntu-latest
    needs: sbom
    # Report what the images that did build found, even if another one failed.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - name: Download findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      - name: Merge findings
        id: merge
        run: |
          shopt -s nullglob
          files=(findings/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo '[]' > all.json; else
            jq -s 'add | unique_by([.image, .id, .package, .installed]) | sort_by(.severity, .id)' "${files[@]}" > all.json
          fi
          count=$(jq length all.json)
          fingerprint=$(jq -r '.[] | "\(.image)|\(.id)|\(.package)|\(.installed)"' all.json | sort | sha256sum | cut -c1-16)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          {
            echo "## Fixable HIGH/CRITICAL vulnerabilities: $count"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Severity | ID | Package | Installed | Fixed in | Image |"
              echo "|---|---|---|---|---|---|"
              jq -r '.[] | "| \(.severity) | \(.id) | \(.package) | \(.installed) | \(.fixed) | \(.image) |"' all.json
              echo
              echo "Fingerprint: \`$fingerprint\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$count" -gt 0 ] && echo "::warning::$count fixable HIGH/CRITICAL vulnerabilities (fingerprint $fingerprint)"
          exit 0

      - name: Check whether this set was already reported
        id: seen
        if: steps.merge.outputs.count != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .t3-notified
          key: t3-vuln-notified-${{ steps.merge.outputs.fingerprint }}
          lookup-only: true

      - name: Post findings to the T3 Code webhook
        id: post
        if: steps.merge.outputs.count != '0' && steps.seen.outputs.cache-hit != 'true'
        env:
          T3_WEBHOOK_URL: ${{ secrets.T3_VULN_WEBHOOK_URL }}
          FINGERPRINT: ${{ steps.merge.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$T3_WEBHOOK_URL" ]; then
            echo "::warning::T3_VULN_WEBHOOK_URL is not set; findings were not sent to T3 Code."
            echo "sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --slurpfile f all.json \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg trigger "$GITHUB_EVENT_NAME" --arg run_url "$RUN_URL" --arg fingerprint "$FINGERPRINT" \
            '{event: "trivy.vulnerabilities", repository: $repository, ref: $ref, sha: $sha,
              trigger: $trigger, run_url: $run_url, fingerprint: $fingerprint,
              count: ($f[0] | length), truncated: (($f[0] | length) > 60), findings: $f[0][:60]}' > payload.json
          curl -fsS --retry 3 --retry-all-errors --max-time 30 \
            -H 'Content-Type: application/json' --data-binary @payload.json \
            -o /dev/null "$T3_WEBHOOK_URL"
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "Sent $(jq .count payload.json) finding(s) to T3 Code (fingerprint $FINGERPRINT)."

      - name: Remember this set as reported
        if: steps.post.outputs.sent == 'true'
        run: date -u +%FT%TZ > .t3-notified

      - name: Save report marker
        if: steps.post.outputs.sent == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .t3-notified
          key: t3-vuln-notified-${{ steps.merge.outputs.fingerprint }}
