name: Daily Dependency Audit

# New advisories against locked dependencies otherwise only surface when an
# unrelated PR hits the audit step and blocks the deploy.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: uv audit on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run uv audit
        id: audit
        run: |
          set -o pipefail
          make audit 2>&1 | tee audit.txt

      - name: Open or update the advisory issue
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit.txt', 'utf8').slice(-6000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `uv audit faalt op main. Zolang dit open staat faalt ook CI op elke PR en wordt er niet gedeployd.\n\n\`\`\`\n${output}\n\`\`\`\n\nRun: ${runUrl}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'dependency-advisory', per_page: 10,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'Dependency-advisory op main (uv audit)',
                body, labels: ['dependency-advisory'], assignees: [context.repo.owner] });
            }
